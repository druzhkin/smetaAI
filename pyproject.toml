[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tenderguard"
version = "0.1.0"
description = "Fail-closed evidence and calculation control plane for tender costing"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "TenderGuard engineering" }]
dependencies = [
  "alembic>=1.14,<2",
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyJWT[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "structlog>=24.4,<27",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
document-worker = [
  "openpyxl>=3.1,<4",
  "pillow>=11,<13",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
]
dev = [
  "boto3-stubs[s3]>=1.35,<2",
  "mypy>=1.14,<2",
  "openpyxl>=3.1,<4",
  "pillow>=11,<13",
  "pip-audit>=2.7,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-openpyxl>=3.1,<4",
]

[project.scripts]
tenderguard = "tenderguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tenderguard"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 85

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tenderguard"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
