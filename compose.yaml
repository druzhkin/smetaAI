services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tenderguard
      POSTGRES_USER: tenderguard
      POSTGRES_PASSWORD: tenderguard
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tenderguard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderguard -d tenderguard"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tenderguard
      MINIO_ROOT_PASSWORD: tenderguard-development-only
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - tenderguard-minio:/data

volumes:
  tenderguard-postgres:
  tenderguard-minio:
