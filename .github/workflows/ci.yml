name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tenderguard_ci
          POSTGRES_USER: tenderguard_ci
          POSTGRES_PASSWORD: tenderguard_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tenderguard_ci -d tenderguard_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.27"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest --cov=tenderguard --cov-report=term-missing
      - run: uv run pip-audit --local
      - name: Migration round-trip
        env:
          DATABASE_URL: sqlite+pysqlite:///./migration-ci.db
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: PostgreSQL evidence immutability guards
        env:
          APP_ENV: test
          AUDIT_SIGNING_KEY: pricing-guard-ci-signing-key-at-least-32-bytes
          DATABASE_URL: postgresql+psycopg://tenderguard_ci:tenderguard_ci_only@localhost:5432/tenderguard_ci
        run: |
          uv run alembic upgrade head
          uv run pytest \
            tests/integration/test_pricing_integrity_postgresql.py \
            tests/integration/test_calculation_integrity_postgresql.py \
            tests/integration/test_business_qualification_postgresql.py \
            tests/integration/test_production_gate_evidence_postgresql.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target api --tag tenderguard-api:ci .
      - run: docker build --target document-worker --tag tenderguard-worker:ci .
